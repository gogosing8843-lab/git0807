name: Weekly Government Notice Crawler

on:
  schedule:
    # 매주 월요일 KST 09:00 (UTC 00:00)
    - cron: '0 0 * * 1'
  workflow_dispatch: # 수동 실행 지원

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crawler Script
        run: |
          python main.py

      - name: Upload Excel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notice-benchmark-excel
          path: 타기관벤치마킹_*.xlsx

      - name: Commit and Push generated Excel file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add 타기관벤치마킹_*.xlsx
          git commit -m "Auto-update: Government notices benchmark excel" || echo "No changes to commit"
          git push

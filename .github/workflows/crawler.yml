name: Daily Busan Policy News

on:
  schedule:
    # 매일 한국시간 오전 2시 (UTC 전날 17:00)
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-busan-policy-news
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Busan News Crawler
        env:
          TZ: Asia/Seoul
        run: |
          python crawler.py

      - name: Commit latest news
        run: |
          if git diff --quiet -- output/latest_news.json; then
            echo "No news JSON changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/latest_news.json
          git commit -m "chore: update daily Busan policy news"
          git push
